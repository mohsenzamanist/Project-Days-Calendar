<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script type="module" src="common.mjs"></script>
        <script type="module" src="web.mjs"></script>
    </head>
    <body>
        <main>
            <div class="controls" id="controls">
                <div class="year-div" id="year-div">
                    <button class="pre-year" id="pre-year">&larr;</button>
                    <select name="year-select" id="year-select"></select>
                    <button class="next-year" id="next-year">&rarr;</button>
                </div>
                <div class="month-div" id="month-div">
                    <button class="pre-month" id="pre-month">&larr;</button>
                    <select name="month-select" id="month-select"></select>
                    <button class="next-month" id="next-month">&rarr;</button>
                </div>
            </div>

            <div class="calendar" id="calendar">

            </div>
        </main>
    </body>
</html>
